<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stamp</title>
    <link rel ="stylesheet" href ="style2.css"/>
<style>
    

input {
    display: block;
    width: 100%;
    margin-bottom: 0.5rem;
    padding: 3px 10px;
    height: 2rem;
}

button {
    padding: 3px 10px;
    cursor: pointer;
}
    </style>
</head>
<body>
    <header class = "fcx bg1">Header</header>
    <main class = "fcy">
        <form id = "form1" class = "card w" style = "padding :2rem">
            <h3 style = "text-align: center; margin-bottom: 1rem;">Myself</h3>
            <label for = "">
                Section
                <input 
                   type = "text"
                   name = "section"
                   id = "section"
                   placeholder="Section"/>
            </label>
            <label for="">
                Roll Number
                <input 
                 type ="text"
                 name = "userName"
                 id="rollNumber"
                 placeholder="Enter Roll NUmber "/>
            </label>
            <label for = "">
                Name
                <input
                type = "text"
                name = "studentName"
                id = "studentName"
                placeholder="Enter Name"/>
            </label>
            <button type ="submit">Submit</button>
            <form>
                <div id = "display"></div>
            </form>
        </form>
    </main>
    <footer class = "fcx bg1">Footer</footer>
    <script>
        let form1 = document.querySelector("#form1");
        let section = document.querySelector("#section");
        let rollNumber = document.querySelector("#rollNumber");
        let studentName = document.querySelector("#studentName");
        let display = document.querySelector("#display");
        form1.addEventListener("submit",cbf);
        function cbf(e){
            e.preventDefault();
            if(
                studentName.value.trim() === ""||
                rollNumber.value.trim() ===""||
                section.value.trim() === ""
        ){
                alert("Please provide complete details");
            } else{
            display.textContent = `Stamp:
            ${section.value}_
            ${rollNumber.value}_
            ${studentName.value}`;
        localStorage.setItem("section",section.value);
        localStorage.setItem("rollNumber",rollNumber.value);
        localStorage.setItem("studentName",studentName.value);
        form1.reset();
            }
            section.addEventListener("focus",cbf2);
            function cbf2(){
                display.textContent = "";
            }
        }
    </script>
    
</body>
</html>
